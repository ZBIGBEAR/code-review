name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL'
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    name: Code Review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install code-review
        run: |
          pip install code-review

      - name: Run Code Review
        env:
          PR_URL: ${{ github.event.pull_request.html_url || inputs.pr_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          code-review pr "$PR_URL"
