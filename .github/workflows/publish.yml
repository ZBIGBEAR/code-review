name: Publish alex-code-review to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Trusted Publisher - no token needed
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build distribution
        run: python setup.py sdist bdist_wheel

      - name: Publish to PyPI
        uses: pypi/publish-python-v1@v1
        with:
          project-name: alex-code-review
