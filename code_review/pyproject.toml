[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review"
version = "0.1.0"
description = "Multi-agent code review system with LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "anthropic>=0.18",
    "python-dotenv>=1.0",
]

[project.scripts]
code-review = "code_review.main:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
